name: Comprobar el contenido

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  content-checks:
    name: content-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-screenshots barre el historial completo buscando imágenes fuera de
          # docs/assets/screenshots/: un original commiteado no se borra con el commit
          # siguiente, así que la comprobación tiene que poder mirar el pasado.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Todos corren siempre, aunque uno falle: quien abre el PR merece ver todo lo que
      # tiene que arreglar de una vez, no de uno en uno.
      - name: Contrato de contenido
        run: node tools/validate-frontmatter.mjs

      # Antes del denylist a propósito: los artefactos del índice no están commiteados,
      # y lo que se publica se revisa. Generarlos aquí los mete en el barrido.
      - name: Índice para el agente
        if: ${{ !cancelled() }}
        run: node tools/build-agent-index.mjs

      - name: Pruebas del índice
        if: ${{ !cancelled() }}
        run: node tools/agent-index.test.mjs

      - name: Contenido no publicable
        if: ${{ !cancelled() }}
        run: node tools/check-denylist.mjs

      - name: Saneamiento de capturas
        if: ${{ !cancelled() }}
        run: node tools/screenshots/scrub.test.mjs

      - name: Capturas trazables
        if: ${{ !cancelled() }}
        run: node tools/screenshots/check-screenshots.mjs

  # `secrets` es el nombre del contexto que exige la protección de `main`: si se
  # renombra el job, la rama queda esperando un check que ya no existe.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      # El binario de gitleaks es MIT y no pide licencia. La envoltura
      # `gitleaks/gitleaks-action@v2` sí: es gratuita solo en repositorios públicos de
      # una cuenta personal y en una organización exige `GITLEAKS_LICENSE`, que el plan
      # Team no trae. Invocamos el binario para que el check dependa de los hallazgos y
      # no de dónde vive el repositorio.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compara commits: necesita el historial, no solo la punta.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # La versión está pinneada y el tarball se verifica: un binario que se descarga
          # en cada corrida y no se comprueba es justo la clase de cosa que este job busca.
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks_${GITLEAKS_VERSION}_*

      # Sobre el historial completo, no sobre el diff del PR: un secreto no se borra con
      # el commit siguiente. `--redact` para no publicar el hallazgo en el log de CI.
      - name: Buscar secretos
        run: gitleaks git . --redact --no-banner --exit-code 1
